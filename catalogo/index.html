<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morfê Personalizados — Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/brand.css">
<style>
  body{ background:var(--creme); position:relative; }
  #fundo-interativo{
    position:fixed; inset:0; z-index:-1;
    overflow:hidden;
    background:var(--creme);
  }
  .fundo-camada{
    position:absolute;
    will-change:transform;
    animation: fundoRespirar 9s ease-in-out infinite;
  }
  .fundo-camada:nth-child(2){ animation-delay:-3s }
  .fundo-camada:nth-child(3){ animation-delay:-6s }
  @keyframes fundoRespirar{
    0%,100%{ opacity:1; }
    50%{ opacity:.7; }
  }
  .fundo-blob-1{
    top:-15%; right:-10%; width:60%; height:60%;
    background:radial-gradient(circle, rgba(212,175,82,.24), transparent 65%);
  }
  .fundo-blob-2{
    bottom:-18%; left:-12%; width:55%; height:55%;
    background:radial-gradient(circle, rgba(76,37,7,.10), transparent 65%);
  }
  .fundo-lampada{
    top:20%; left:58%; width:36%; height:36%;
    animation: fundoLampadaRespira 9s ease-in-out infinite -4.5s;
  }
  .fundo-lampada svg{ width:100%; height:100%; }
  @keyframes fundoLampadaRespira{
    0%,100%{ opacity:.04; }
    50%{ opacity:.09; }
  }

  header{
    background: linear-gradient(120deg, var(--terracota-2) 0%, var(--terracota) 55%, var(--terracota-escuro) 100%);
    color: var(--creme);
    padding: 14px 18px;
    position: sticky;
    top: 0;
    z-index: 30;
    box-shadow: var(--sombra-lg);
    overflow: hidden;
  }
  header::before{
    content:'';
    position:absolute; inset:0; z-index:0;
    background-image: radial-gradient(rgba(255,251,226,.10) 1px, transparent 1px);
    background-size: 15px 15px;
    pointer-events:none;
  }
  header::after{
    content:'';
    position:absolute; top:0; bottom:0; width:35%; z-index:0;
    background:linear-gradient(100deg, transparent, rgba(212,175,82,.28), transparent);
    transform:translateX(-160%);
    animation: brilhoHeader 6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes brilhoHeader{
    0%{ transform:translateX(-160%); }
    18%{ transform:translateX(340%); }
    100%{ transform:translateX(340%); }
  }
  .header-topo{
    display:flex;
    align-items:center;
    gap:12px;
    max-width:1440px;
    margin:0 auto;
    position:relative;
    z-index:1;
  }
  .marca-link{
    display:flex; align-items:center; gap:12px; flex:1; min-width:0;
    text-decoration:none; color:inherit;
    transition: opacity .15s ease;
  }
  .marca-link:active{ opacity:.75 }
  .header-topo img{
    height:58px; width:58px; border-radius:14px; flex-shrink:0;
    box-shadow: 0 0 0 2px rgba(255,251,226,.25), 0 6px 16px rgba(0,0,0,.3);
  }
  .header-topo .marca{ flex:1; min-width:0 }
  .header-topo .marca h1{ font-family:var(--fonte-titulo); font-size:23px; font-weight:700; letter-spacing:-.2px }
  .header-topo .marca p{ font-size:12px; opacity:.8; margin-top:2px }
  .icon-btn{
    background:rgba(255,255,255,.12);
    border:none;
    color:var(--creme);
    width:40px; height:40px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    flex-shrink:0;
    transition: background-color .2s ease, transform .15s ease;
  }
  .icon-btn:hover{ background:rgba(255,255,255,.22) }
  .icon-btn:active{ transform:scale(.92) }
  .icon-btn.ativo{ background:rgba(232,72,58,.22); color:var(--vermelho-favorito) }
  .icon-btn.ativo svg{ fill:currentColor }
  .icon-btn .contagem{
    position:absolute; top:-5px; right:-5px;
    background:var(--dourado); color:var(--terracota-escuro);
    font-size:10px; font-weight:800;
    min-width:17px; height:17px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    padding:0 3px;
    box-shadow:0 0 0 2px var(--terracota);
  }
  @keyframes bounceCarrinho{
    0%{ transform:scale(1) }
    30%{ transform:scale(1.28) rotate(-6deg) }
    55%{ transform:scale(.92) rotate(4deg) }
    75%{ transform:scale(1.08) rotate(-2deg) }
    100%{ transform:scale(1) rotate(0) }
  }
  .icon-btn.pulando{ animation: bounceCarrinho .55s ease; }
  @keyframes badgePop{
    0%{ transform:scale(0) }
    60%{ transform:scale(1.35) }
    100%{ transform:scale(1) }
  }
  .contagem.pop{ animation: badgePop .35s ease; }

  .header-busca{ max-width:1440px; margin:10px auto 0; position:relative; z-index:1 }
  .header-busca input{
    width:100%;
    padding:10px 14px 10px 36px;
    border-radius:9px;
    border:none;
    font-size:14px;
    transition: box-shadow .2s ease;
  }
  .header-busca input:focus{ outline:none; box-shadow:0 0 0 3px rgba(177,140,53,.5) }
  .header-busca svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#a89a7a }

  .layout{
    max-width:1440px;
    margin:0 auto;
    display:grid;
    grid-template-columns:220px 1fr;
    gap:22px;
    padding:20px 18px 60px;
  }
  @media (max-width:760px){
    .layout{ grid-template-columns:1fr; }
    .sidebar{ display:none; }
  }

  .sidebar{
    background:var(--branco);
    border-radius:12px;
    padding:16px;
    height:fit-content;
    position:sticky;
    top:150px;
    box-shadow:var(--sombra);
  }
  .sidebar h3{ font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--texto-claro); margin-bottom:10px }
  .sidebar-item{
    display:flex; justify-content:space-between; align-items:center;
    width:100%; background:none; border:none;
    padding:9px 10px; border-radius:8px;
    font-size:14px; text-align:left; color:var(--texto);
    margin-bottom:2px;
    transition: background-color .18s ease, color .18s ease;
  }
  .sidebar-item:hover{ background:var(--creme) }
  .sidebar-item.ativo{ background:var(--terracota); color:var(--creme); font-weight:700 }
  .sidebar-item .contagem-cat{ font-size:12px; opacity:.7 }
  .sidebar-item svg{ vertical-align:-3px; margin-right:6px }
  .sidebar-fav{ margin-top:12px; padding-top:12px; border-top:1px solid #eee2c8 }

  .filtro-mobile-btn{ display:none; }
  @media (max-width:760px){
    .filtro-mobile-btn{
      display:flex;
      position:fixed;
      right:16px;
      bottom:22px;
      z-index:40;
      width:auto;
      padding:13px 20px;
      border-radius:30px;
      box-shadow: var(--sombra-lg), 0 0 0 1px rgba(76,37,7,.06);
    }
  }

  /* Fundo/painel compartilhado (pedido, filtro mobile) */
  .sobreposicao{
    position:fixed; inset:0; z-index:50;
    background:rgba(58,32,10,0);
    visibility:hidden; opacity:0;
    transition: opacity .3s ease, background-color .3s ease, visibility 0s linear .3s;
  }
  .sobreposicao.aberto{
    visibility:visible; opacity:1; background:rgba(58,32,10,.45);
    transition: opacity .3s ease, background-color .3s ease, visibility 0s linear 0s;
  }

  .filtro-mobile-conteudo{
    position:absolute; bottom:0; left:0; right:0;
    background:var(--branco);
    border-radius:18px 18px 0 0;
    padding:18px;
    max-height:70vh;
    overflow-y:auto;
    transform: translateY(100%);
    transition: transform .32s cubic-bezier(.2,.8,.2,1);
  }
  .sobreposicao.aberto .filtro-mobile-conteudo{ transform: translateY(0); }
  .filtro-mobile-conteudo h3{ margin-bottom:12px; display:flex; justify-content:space-between; align-items:center }
  .btn-fechar-x{ background:none; border:none; color:var(--texto); padding:4px }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
    gap:16px;
    align-content:start;
  }
  @media (max-width:760px){
    .layout{ padding-bottom:90px; }
    .grid{ grid-template-columns:1fr 1fr; gap:10px; }
    .card{ padding:12px 11px 11px; gap:6px; }
    .card .nome{ font-size:14px; padding-right:16px }
    .card .preco{ font-size:18px }
    .card .fav-btn{ top:9px; right:9px }
    .card .fav-btn svg{ width:16px; height:16px }
    .card .card-botoes .btn{ font-size:12.5px; padding:8px 8px }
    .header-topo img{ height:42px; width:42px; border-radius:10px }
    .header-topo .marca h1{ font-size:16px }
    .header-topo .marca p{ font-size:10px }
    .modal{ padding:18px; max-width:100% }
    .modal-categoria{ margin-top:26px }
  }

  @keyframes cardEntrada{
    from{ opacity:0; transform:translateY(16px) }
    to{ opacity:1; transform:translateY(0) }
  }
  .card{
    background:var(--branco);
    border-radius:12px;
    padding:17px 16px 16px;
    box-shadow:var(--sombra);
    position:relative;
    display:flex;
    flex-direction:column;
    gap:8px;
    overflow:hidden;
    cursor:pointer;
    animation: cardEntrada .45s cubic-bezier(.2,.7,.3,1) backwards;
    transition: transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s ease;
  }
  .card::before{
    content:'';
    position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, var(--dourado-claro), var(--dourado), var(--terracota-2));
    transform:scaleX(0);
    transform-origin:center;
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .card::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,.55) 50%, transparent 60%);
    transform:translateX(-120%);
    pointer-events:none;
  }
  .card:hover{ transform:translateY(-6px); box-shadow:var(--sombra-lg), var(--sombra-dourada) }
  .card:hover::before{ transform:scaleX(1) }
  .card:hover::after{ transform:translateX(120%); transition:transform .85s ease }
  .card-imagem{
    margin:-17px -16px 4px;
    aspect-ratio:1/1;
    background:var(--creme);
  }
  .card-imagem img{ width:100%; height:100%; object-fit:cover; display:block }
  .card .fav-btn{
    position:absolute; top:12px; right:12px; z-index:2;
    width:30px; height:30px; border-radius:50%;
    background:rgba(255,255,255,.88); border:none;
    color:#d8cdb5;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 5px rgba(0,0,0,.18);
    transition: color .2s ease, transform .15s ease;
  }
  .card .fav-btn:active{ transform:scale(.85) }
  .card .fav-btn.ativo{ color:var(--vermelho-favorito) }
  .card .fav-btn.ativo svg{ fill:currentColor }
  @keyframes popCoracao{
    0%{ transform:scale(1) }
    35%{ transform:scale(1.4) }
    60%{ transform:scale(.88) }
    100%{ transform:scale(1) }
  }
  .card .fav-btn.pop{ animation: popCoracao .4s ease; }
  .card .categoria-label{ font-size:10.5px; color:var(--dourado); font-weight:700; text-transform:uppercase; letter-spacing:.6px }
  .card .nome{ font-family:var(--fonte-titulo); font-size:16.5px; font-weight:600; line-height:1.28; padding-right:20px; color:#241f14 }
  .card .cores{ display:flex; gap:5px; align-items:center; flex-wrap:wrap }
  .card .cores span{
    width:14px; height:14px; border-radius:50%;
    border:1px solid rgba(0,0,0,.15);
    display:inline-block;
    transition: transform .15s ease;
  }
  .card .cores span:hover{ transform:scale(1.25) }
  .card .preco{ font-family:var(--fonte-titulo); font-size:22px; font-weight:700; color:var(--terracota); margin-top:auto; letter-spacing:-.3px }
  .card .preco .cifrao{ font-size:13px; font-weight:600; vertical-align:4px; margin-right:1px; font-family:var(--fonte-corpo) }
  .card .card-botoes{ display:flex; gap:8px }
  .card .card-botoes .btn{ flex:1; font-size:13px; padding:9px 10px }

  .estado-msg{ text-align:center; padding:50px 20px; color:var(--texto-claro); grid-column:1/-1 }

  /* Painel de pedido */
  .painel-pedido{
    position:absolute; top:0; right:0; bottom:0;
    width:min(400px, 100%);
    background:var(--branco);
    display:flex; flex-direction:column;
    transform: translateX(100%);
    transition: transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .sobreposicao.aberto .painel-pedido{ transform: translateX(0); }
  .painel-topo{
    background: linear-gradient(120deg, var(--terracota-2), var(--terracota));
    color:var(--creme);
    padding:16px 18px; display:flex; justify-content:space-between; align-items:center;
  }
  .painel-topo strong{ font-family:var(--fonte-titulo); font-size:18px; font-weight:600 }
  .painel-topo button{ background:none; border:none; color:var(--creme) }
  .painel-itens{ flex:1; overflow-y:auto; padding:12px 18px }
  .item-pedido{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:12px 0; border-bottom:1px solid #f1ead6; gap:8px;
    animation: cardEntrada .3s ease backwards;
  }
  .item-pedido .info{ flex:1; min-width:0 }
  .item-pedido .info .nome{ font-weight:700; font-size:14px }
  .item-pedido .info .cor{ font-size:12px; color:var(--texto-claro) }
  .item-pedido .qtd{ display:flex; align-items:center; gap:8px; margin-top:6px }
  .item-pedido .qtd button{ width:24px; height:24px; border-radius:6px; border:1px solid #ddd; background:#fff; transition: background-color .15s ease }
  .item-pedido .qtd button:hover{ background:var(--creme) }
  .item-pedido .remover{ background:none; border:none; color:#b3261e; font-size:12px; margin-top:4px }
  .item-pedido .preco-item{ font-weight:700; font-size:14px; white-space:nowrap }
  .painel-rodape{ padding:16px 18px; border-top:1px solid #eee2c8 }
  .painel-rodape .total{ display:flex; justify-content:space-between; font-weight:800; font-size:16px; margin-bottom:12px }

  /* Modal de seleção de cor */
  .modal-fundo{
    position:fixed; inset:0; z-index:70;
    background:rgba(58,32,10,0);
    visibility:hidden; opacity:0;
    display:flex; align-items:center; justify-content:center; padding:20px;
    transition: opacity .25s ease, background-color .25s ease, visibility 0s linear .25s;
  }
  .modal-fundo.aberto{
    visibility:visible; opacity:1; background:rgba(58,32,10,.45);
    transition: opacity .25s ease, background-color .25s ease, visibility 0s linear 0s;
  }
  .modal{
    background:var(--branco); border-radius:14px; padding:22px;
    max-width:380px; width:100%;
    position:relative;
    transform: scale(.9) translateY(10px);
    opacity:0;
    transition: transform .25s cubic-bezier(.2,.8,.2,1), opacity .25s ease;
  }
  .modal-fundo.aberto .modal{ transform: scale(1) translateY(0); opacity:1; }
  .modal.modal-produto{
    max-width:900px;
    max-height:88vh;
    overflow-y:auto;
  }
  .modal-grid{
    display:grid;
    grid-template-columns:300px 1fr;
    gap:28px;
  }
  .modal-grid.sem-imagem{ grid-template-columns:1fr; }
  .modal-col-imagem .modal-imagem{
    aspect-ratio:1/1;
    border-radius:12px;
    overflow:hidden;
    background:var(--creme);
  }
  .modal-col-imagem .modal-imagem img{ width:100%; height:100%; object-fit:cover; display:block }
  @media (max-width:760px){
    .modal.modal-produto{ padding:16px; max-height:92vh }
    .modal-grid{ grid-template-columns:1fr; gap:14px }
    .modal-col-imagem .modal-imagem{ aspect-ratio:4/3 }
  }

  .modal-relacionados-bloco{ margin-top:26px; padding-top:20px; border-top:1px solid #f1ead6 }
  .modal-relacionados-bloco h4{ font-family:var(--fonte-titulo); font-size:15px; font-weight:600; color:var(--terracota); margin-bottom:12px }
  .relacionados-linha{ display:flex; gap:12px; overflow-x:auto; padding-bottom:4px }
  .relacionado-card{
    flex-shrink:0; width:120px; cursor:pointer;
    border-radius:10px; overflow:hidden; background:var(--creme);
    border:1px solid #f1ead6;
    transition: transform .15s ease;
  }
  .relacionado-card:hover{ transform:translateY(-2px) }
  .relacionado-card .relacionado-img{ width:100%; aspect-ratio:1/1; background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden }
  .relacionado-card .relacionado-img img{ width:100%; height:100%; object-fit:cover }
  .relacionado-card .relacionado-info{ padding:8px 9px }
  .relacionado-card .relacionado-nome{ font-size:12px; font-weight:600; line-height:1.25; margin-bottom:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
  .relacionado-card .relacionado-preco{ font-size:12.5px; font-weight:800; color:var(--terracota) }
  .btn-voltar-modal{
    position:absolute; top:14px; left:14px;
    width:32px; height:32px; border-radius:50%;
    background:var(--creme); border:none; color:var(--terracota);
    display:flex; align-items:center; justify-content:center;
    transition: background-color .15s ease;
  }
  .btn-voltar-modal:hover{ background:#f0e6c8 }
  .modal-categoria{ font-size:11px; color:var(--dourado); font-weight:700; text-transform:uppercase; letter-spacing:.6px; margin-bottom:4px; margin-top:30px }
  .modal h3{ font-family:var(--fonte-titulo); font-size:20px; font-weight:600; margin-bottom:6px }
  .modal .preco-modal{ font-family:var(--fonte-titulo); color:var(--terracota); font-weight:700; font-size:19px; margin-bottom:12px }
  .modal-descricao{ font-size:13.5px; color:var(--texto-claro); line-height:1.5; margin-bottom:16px }
  .modal-label{ display:block; font-size:12px; font-weight:700; color:var(--texto); margin-bottom:8px }
  .modal-cores-bloco{ margin-bottom:6px }
  .opcoes-cor{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px }
  .opcao-cor{
    border:1.5px solid #e4dcc8; border-radius:8px;
    padding:7px 12px; font-size:13px; background:#fff;
    display:flex; align-items:center; gap:6px;
    transition: border-color .15s ease, background-color .15s ease, transform .12s ease;
  }
  .opcao-cor:active{ transform:scale(.95) }
  .opcao-cor span{ width:12px; height:12px; border-radius:50%; border:1px solid rgba(0,0,0,.15) }
  .opcao-cor.selecionada{ border-color:var(--terracota); background:var(--creme); font-weight:700 }
  .modal-botoes{ display:flex; gap:10px }
  .modal-botoes .btn{ flex:1 }

  /* Bolinha voadora ao adicionar */
  .voador{
    position:fixed; width:14px; height:14px; border-radius:50%;
    background:var(--dourado); z-index:200; pointer-events:none;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
    transition: transform .55s cubic-bezier(.3,.6,.4,1), opacity .4s ease .15s;
  }

  footer{ text-align:center; padding:20px; font-size:12px; color:var(--texto-claro) }

  #pre-carregador{
    position:fixed; inset:0; z-index:1000;
    background: linear-gradient(135deg, var(--terracota-2), var(--terracota) 55%, var(--terracota-escuro));
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
    transition: opacity .5s ease, visibility 0s linear .5s;
  }
  #pre-carregador.saindo{ opacity:0; visibility:hidden; }
  .pre-logo img{
    width:40px; height:40px; border-radius:10px;
    animation: preLogoPulso 1.4s ease-in-out infinite;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }
  @keyframes preLogoPulso{
    0%,100%{ transform:scale(1); opacity:.85 }
    50%{ transform:scale(1.08); opacity:1 }
  }
  .pre-liquido-nivel{ animation: preNivel 2.4s ease-in-out infinite alternate; }
  @keyframes preNivel{
    0%{ transform:translateY(48px); }
    100%{ transform:translateY(2px); }
  }
  .pre-onda{ animation: preOnda 1.6s ease-in-out infinite; }
  @keyframes preOnda{
    0%,100%{ transform:translateX(0); }
    50%{ transform:translateX(-20px); }
  }
  .pre-texto{ color:var(--creme); font-family:var(--fonte-titulo); font-size:13px; opacity:.75; letter-spacing:.3px }
</style>
</head>
<body>

<div id="fundo-interativo">
  <div class="fundo-camada fundo-blob-1" data-profundidade="16"></div>
  <div class="fundo-camada fundo-blob-2" data-profundidade="26"></div>
  <div class="fundo-camada fundo-lampada" data-profundidade="38">
    <svg viewBox="0 0 100 100" fill="none" stroke="var(--dourado)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 10c-14 0-24 10-24 23 0 9 5 15 9 20 3 3 5 6 5 10h20c0-4 2-7 5-10 4-5 9-11 9-20 0-13-10-23-24-23Z"/>
      <path d="M42 68h16M44 76h12M47 84h6"/>
      <path d="M50 20v14M40 34l7 6M60 34l-7 6" stroke-width="1.6"/>

<script>
const SUPABASE_URL = "https://rzicwtwowfyogtcqekun.supabase.co";
const SUPABASE_KEY = "sb_publishable_s4JUXdMlfy70pWIz780U9w_2IVSAI5t";
const WHATSAPP_NUMERO = "5592994875346";
const HEADERS = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };

const ICONE_CORACAO = '<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.2-4.5-9.6-9C.6 8.6 2 4.9 5.7 4.2c2-.4 4 .5 5 2.1a1 1 0 0 0 1.6 0c1-1.6 3-2.5 5-2.1C20.9 4.9 22.3 8.6 20.5 12 18.2 16.5 12 21 12 21Z"/></svg>';

let categorias = [];
let produtos = [];
let coresPorProduto = {};
let designsPorProduto = {};
let categoriaAtiva = null;
let somenteFavoritos = false;
let termoBusca = '';

let favoritos = new Set(JSON.parse(localStorage.getItem('morfe_favoritos') || '[]'));
let listaPedido = JSON.parse(localStorage.getItem('morfe_lista_pedido') || '[]');

function salvarFavoritos(){ localStorage.setItem('morfe_favoritos', JSON.stringify([...favoritos])); }
function salvarPedido(){ localStorage.setItem('morfe_lista_pedido', JSON.stringify(listaPedido)); }

function formatarPreco(centavos){
  return (centavos / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function formatarPrecoCard(centavos){
  const valor = (centavos / 100).toFixed(2).replace('.', ',');
  return `<span class="cifrao">R$</span>${valor}`;
}
function normalizar(texto){
  return texto.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}
function corParaHex(nome){
  const n = normalizar(nome);
  if (n.includes('azul')) return '#3B6FD6';
  if (n.includes('vermelh')) return '#D6423B';
  if (n.includes('preto')) return '#222222';
  if (n.includes('amarel')) return '#E8C93B';
  if (n.includes('verde')) return '#3BAA5C';
  if (n.includes('rosa')) return '#E9688E';
  if (n.includes('branc')) return '#FFFFFF';
  if (n.includes('dourad')) return '#B18C35';
  if (n.includes('prata') || n.includes('fosco')) return '#B7B7B7';
  return '#CCCCCC';
}

async function carregarDados(){
  const [resCat, resProd, resCores, resVinculos] = await Promise.all([
    fetch(`${SUPABASE_URL}/rest/v1/catalog_categories?select=id,name,sort_order&order=sort_order`, { headers: HEADERS }),
    fetch(`${SUPABASE_URL}/rest/v1/catalog_products?select=id,category_id,name,price_cents,description,badge,image_url,sort_order&is_available=eq.true&order=sort_order`, { headers: HEADERS }),
    fetch(`${SUPABASE_URL}/rest/v1/catalog_product_colors?select=id,product_id,name,sort_order&order=sort_order`, { headers: HEADERS }),
    fetch(`${SUPABASE_URL}/rest/v1/catalog_product_designs?select=product_id,catalog_designs(id,name,theme)`, { headers: HEADERS })
  ]);
  categorias = await resCat.json();
  produtos = await resProd.json();
  const cores = await resCores.json();
  coresPorProduto = {};
  cores.forEach(c => {
    if (!coresPorProduto[c.product_id]) coresPorProduto[c.product_id] = [];
    coresPorProduto[c.product_id].push(c);
  });
  const vinculos = await resVinculos.json();
  designsPorProduto = {};
  vinculos.forEach(v => {
    if (!v.catalog_designs) return;
    if (!designsPorProduto[v.product_id]) designsPorProduto[v.product_id] = [];
    designsPorProduto[v.product_id].push(v.catalog_designs);
  });
}

function contarPorCategoria(catId){
  return produtos.filter(p => p.category_id === catId).length;
}

function renderSidebar(containerId){
  const el = document.getElementById(containerId);
  el.innerHTML = '';

  const h = document.createElement('h3');
  h.textContent = 'Categorias';
  el.appendChild(h);

  const btnTodas = document.createElement('button');
  btnTodas.className = 'sidebar-item' + (categoriaAtiva === null ? ' ativo' : '');
  btnTodas.innerHTML = `<span>Todas</span><span class="contagem-cat">${produtos.length}</span>`;
  btnTodas.onclick = () => { categoriaAtiva = null; renderTudo(); };
  el.appendChild(btnTodas);

  categorias.forEach(cat => {
    const n = contarPorCategoria(cat.id);
    if (n === 0) return;
    const btn = document.createElement('button');
    btn.className = 'sidebar-item' + (categoriaAtiva === cat.id ? ' ativo' : '');
    btn.innerHTML = `<span>${cat.name}</span><span class="contagem-cat">${n}</span>`;
    btn.onclick = () => { categoriaAtiva = cat.id; renderTudo(); fecharFiltroMobile(); };
    el.appendChild(btn);
  });

  const divFav = document.createElement('div');
  divFav.className = 'sidebar-fav';
  const btnFav = document.createElement('button');
  btnFav.className = 'sidebar-item' + (somenteFavoritos ? ' ativo' : '');
  btnFav.innerHTML = `<span>${ICONE_CORACAO} Favoritos</span><span class="contagem-cat">${favoritos.size}</span>`;
  btnFav.onclick = () => { somenteFavoritos = !somenteFavoritos; renderTudo(); fecharFiltroMobile(); };
  divFav.appendChild(btnFav);
  el.appendChild(divFav);
}

function produtosFiltrados(){
  return produtos.filter(p => {
    if (categoriaAtiva !== null && p.category_id !== categoriaAtiva) return false;
    if (somenteFavoritos && !favoritos.has(p.id)) return false;
    if (termoBusca && !normalizar(p.name).includes(normalizar(termoBusca))) return false;
    return true;
  });
}

function renderGrid(){
  const grid = document.getElementById('grid-produtos');
  const lista = produtosFiltrados();
  grid.innerHTML = '';

  if (lista.length === 0){
    grid.innerHTML = '<div class="estado-msg">Nenhum produto encontrado.</div>';
    return;
  }

  lista.forEach((p, idx) => {
    const cat = categorias.find(c => c.id === p.category_id);
    const cores = coresPorProduto[p.id] || [];
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = Math.min(idx * 35, 350) + 'ms';

    const coresHtml = cores.length
      ? `<div class="cores">${cores.map(c => `<span style="background:${corParaHex(c.name)}" title="${c.name}"></span>`).join('')}</div>`
      : '';

    card.innerHTML = `
      ${p.image_url ? `<div class="card-imagem"><img src="${p.image_url}" alt="${p.name}" loading="lazy"></div>` : ''}
      <button class="fav-btn ${favoritos.has(p.id) ? 'ativo' : ''}" data-id="${p.id}">${ICONE_CORACAO}</button>
      ${p.badge ? `<div class="badge">${p.badge}</div>` : ''}
      <div class="categoria-label">${cat ? cat.name : ''}</div>
      <div class="nome">${p.name}</div>
      ${coresHtml}
      <div class="preco">${formatarPrecoCard(p.price_cents)}</div>
      <div class="card-botoes">
        <button class="btn btn-primario" data-add="${p.id}">Adicionar</button>
      </div>
    `;

    const favBtn = card.querySelector('.fav-btn');
    favBtn.onclick = (e) => { e.stopPropagation(); alternarFavorito(p.id, favBtn); };
    card.querySelector('[data-add]').onclick = (e) => { e.stopPropagation(); abrirAdicionar(p.id, e.currentTarget); };
    card.onclick = () => abrirDetalhe(p.id);

    grid.appendChild(card);
  });
}

function renderTudo(){
  renderSidebar('sidebar-desktop');
  renderSidebar('sidebar-mobile');
  renderGrid();
  atualizarContagemFavoritos();
}

function atualizarContagemFavoritos(){
  document.getElementById('contagem-favoritos').textContent = favoritos.size;
}

function alternarFavorito(produtoId, botao){
  if (favoritos.has(produtoId)) favoritos.delete(produtoId); else favoritos.add(produtoId);
  salvarFavoritos();
  atualizarContagemFavoritos();

  if (somenteFavoritos){
    renderTudo();
    return;
  }

  botao.classList.toggle('ativo', favoritos.has(produtoId));
  botao.classList.remove('pop');
  void botao.offsetWidth;
  botao.classList.add('pop');
  renderSidebar('sidebar-desktop');
  renderSidebar('sidebar-mobile');
}

/* ---- Adicionar à lista / modal de detalhe ---- */
let produtoModalId = null;
let corModalSelecionada = null;
let arteModalSelecionada = null;
let origemAdicaoAtual = null;

function preencherModal(produtoId, botaoOrigem){
  const p = produtos.find(x => x.id === produtoId);
  const cat = categorias.find(c => c.id === p.category_id);
  const cores = coresPorProduto[produtoId] || [];
  const artes = designsPorProduto[produtoId] || [];

  produtoModalId = produtoId;
  corModalSelecionada = cores.length ? cores[0].name : null;
  arteModalSelecionada = null;
  origemAdicaoAtual = botaoOrigem || document.getElementById('modal-confirmar');

  document.getElementById('modal-categoria').textContent = cat ? cat.name : '';
  document.getElementById('modal-nome').textContent = p.name;
  document.getElementById('modal-preco').textContent = formatarPreco(p.price_cents);
  document.getElementById('modal-observacao').value = '';

  const descEl = document.getElementById('modal-descricao');
  if (p.description){
    descEl.textContent = p.description;
    descEl.style.display = 'block';
  } else {
    descEl.style.display = 'none';
  }

  const blocoCores = document.getElementById('modal-cores-bloco');
  const coresEl = document.getElementById('modal-cores');
  coresEl.innerHTML = '';
  if (cores.length){
    blocoCores.style.display = 'block';
    cores.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'opcao-cor' + (c.name === corModalSelecionada ? ' selecionada' : '');
      btn.innerHTML = `<span style="background:${corParaHex(c.name)}"></span>${c.name}`;
      btn.onclick = () => {
        corModalSelecionada = c.name;
        [...coresEl.children].forEach(el => el.classList.remove('selecionada'));
        btn.classList.add('selecionada');
      };
      coresEl.appendChild(btn);
    });
  } else {
    blocoCores.style.display = 'none';
  }

  const blocoArtes = document.getElementById('modal-artes-bloco');
  const artesEl = document.getElementById('modal-artes');
  artesEl.innerHTML = '';
  if (artes.length){
    blocoArtes.style.display = 'block';
    artes.forEach(a => {
      const btn = document.createElement('button');
      btn.className = 'opcao-cor';
      btn.textContent = a.name;
      btn.onclick = () => {
        const jaSelecionada = arteModalSelecionada === a.name;
        arteModalSelecionada = jaSelecionada ? null : a.name;
        [...artesEl.children].forEach(el => el.classList.remove('selecionada'));
        if (!jaSelecionada) btn.classList.add('selecionada');
      };
      artesEl.appendChild(btn);
    });
  } else {
    blocoArtes.style.display = 'none';
  }

  const imgBloco = document.getElementById('modal-imagem');
  const imgEl = document.getElementById('modal-imagem-img');
  const grid = document.getElementById('modal-grid');
  if (p.image_url){
    imgEl.src = p.image_url;
    imgEl.alt = p.name;
    imgBloco.style.display = 'block';
    grid.classList.remove('sem-imagem');
  } else {
    imgBloco.style.display = 'none';
    grid.classList.add('sem-imagem');
  }

  renderRelacionados('bloco-relacionados-tema', 'relacionados-tema', produtosMesmoTema(produtoId));
  renderRelacionados('bloco-relacionados-cat', 'relacionados-cat', produtosMesmaCategoria(produtoId));

  document.getElementById('modal-fundo').classList.add('aberto');
  document.querySelector('.modal-produto').scrollTop = 0;
}

function produtosMesmoTema(produtoId){
  const minhasArtes = (designsPorProduto[produtoId] || []).map(a => a.id);
  if (!minhasArtes.length) return [];
  const idsRelacionados = new Set();
  produtos.forEach(p => {
    if (p.id === produtoId) return;
    const artesDele = (designsPorProduto[p.id] || []).map(a => a.id);
    if (artesDele.some(id => minhasArtes.includes(id))) idsRelacionados.add(p.id);
  });
  return produtos.filter(p => idsRelacionados.has(p.id));
}

function produtosMesmaCategoria(produtoId){
  const p = produtos.find(x => x.id === produtoId);
  return produtos.filter(x => x.id !== produtoId && x.category_id === p.category_id).slice(0, 8);
}

function renderRelacionados(blocoId, linhaId, lista){
  const bloco = document.getElementById(blocoId);
  const linha = document.getElementById(linhaId);
  linha.innerHTML = '';
  if (!lista.length){
    bloco.style.display = 'none';
    return;
  }
  bloco.style.display = 'block';
  lista.forEach(p => {
    const card = document.createElement('div');
    card.className = 'relacionado-card';
    card.innerHTML = `
      <div class="relacionado-img">${p.image_url ? `<img src="${p.image_url}" alt="${p.name}">` : ''}</div>
      <div class="relacionado-info">
        <div class="relacionado-nome">${p.name}</div>
        <div class="relacionado-preco">${formatarPreco(p.price_cents)}</div>
      </div>
    `;
    card.onclick = () => preencherModal(p.id, null);
    linha.appendChild(card);
  });
}

function abrirDetalhe(produtoId){
  preencherModal(produtoId, null);
}

function abrirAdicionar(produtoId, botaoOrigem){
  preencherModal(produtoId, botaoOrigem);
}

document.getElementById('modal-cancelar').onclick = () => {
  document.getElementById('modal-fundo').classList.remove('aberto');
};
document.getElementById('btn-voltar-modal').onclick = () => {
  document.getElementById('modal-fundo').classList.remove('aberto');
};
document.getElementById('modal-confirmar').onclick = () => {
  const p = produtos.find(x => x.id === produtoModalId);
  const observacao = document.getElementById('modal-observacao').value.trim();
  document.getElementById('modal-fundo').classList.remove('aberto');
  voarParaCarrinho(origemAdicaoAtual || document.getElementById('modal-confirmar'));
  adicionarAoPedido(p, corModalSelecionada, arteModalSelecionada, observacao);
};

/* ---- Animação de voo até o carrinho ---- */
function voarParaCarrinho(elementoOrigem){
  if (!elementoOrigem) return;
  const origem = elementoOrigem.getBoundingClientRect();
  const btnPedido = document.getElementById('btn-pedido');
  const destino = btnPedido.getBoundingClientRect();

  const startX = origem.left + origem.width / 2 - 7;
  const startY = origem.top + origem.height / 2 - 7;
  const dx = (destino.left + destino.width / 2) - (startX + 7);
  const dy = (destino.top + destino.height / 2) - (startY + 7);

  const voador = document.createElement('div');
  voador.className = 'voador';
  voador.style.left = startX + 'px';
  voador.style.top = startY + 'px';
  voador.style.transform = 'translate(0,0) scale(1)';
  voador.style.opacity = '1';
  document.body.appendChild(voador);

  requestAnimationFrame(() => {
    voador.style.transform = `translate(${dx}px, ${dy}px) scale(.25)`;
    voador.style.opacity = '0';
  });

  setTimeout(() => {
    voador.remove();
    btnPedido.classList.remove('pulando');
    void btnPedido.offsetWidth;
    btnPedido.classList.add('pulando');
    const contagemEl = document.getElementById('contagem-pedido');
    contagemEl.classList.remove('pop');
    void contagemEl.offsetWidth;
    contagemEl.classList.add('pop');
  }, 560);
}

function adicionarAoPedido(produto, cor, arte, observacao){
  const existente = listaPedido.find(i => i.product_id === produto.id && i.cor === cor && i.arte === (arte || null) && i.observacao === (observacao || ''));
  if (existente){
    existente.qtd += 1;
  } else {
    listaPedido.push({ product_id: produto.id, nome: produto.name, preco_cents: produto.price_cents, cor, arte: arte || null, observacao: observacao || '', qtd: 1 });
  }
  salvarPedido();
  renderPainelPedido();
}

/* ---- Painel do pedido ---- */
function renderPainelPedido(){
  const itensEl = document.getElementById('painel-itens');
  const contagemEl = document.getElementById('contagem-pedido');
  const totalQtd = listaPedido.reduce((s, i) => s + i.qtd, 0);

  contagemEl.textContent = totalQtd;

  if (listaPedido.length === 0){
    itensEl.innerHTML = '<p style="color:var(--texto-claro); text-align:center; padding:30px 0">Sua lista está vazia.</p>';
  } else {
    itensEl.innerHTML = '';
    listaPedido.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = 'item-pedido';
      div.innerHTML = `
        <div class="info">
          <div class="nome">${item.nome}</div>
          ${item.cor ? `<div class="cor">Cor: ${item.cor}</div>` : ''}
          ${item.arte ? `<div class="cor">Arte: ${item.arte}</div>` : ''}
          ${item.observacao ? `<div class="cor">Obs: ${item.observacao}</div>` : ''}
          <div class="qtd">
            <button data-menos="${idx}">−</button>
            <span>${item.qtd}</span>
            <button data-mais="${idx}">+</button>
          </div>
          <button class="remover" data-remover="${idx}">Remover</button>
        </div>
        <div class="preco-item">${formatarPreco(item.preco_cents * item.qtd)}</div>
      `;
      itensEl.appendChild(div);
    });
    itensEl.querySelectorAll('[data-mais]').forEach(b => b.onclick = () => { listaPedido[b.dataset.mais].qtd++; salvarPedido(); renderPainelPedido(); });
    itensEl.querySelectorAll('[data-menos]').forEach(b => b.onclick = () => {
      const i = b.dataset.menos;
      listaPedido[i].qtd--;
      if (listaPedido[i].qtd <= 0) listaPedido.splice(i, 1);
      salvarPedido(); renderPainelPedido();
    });
    itensEl.querySelectorAll('[data-remover]').forEach(b => b.onclick = () => {
      listaPedido.splice(b.dataset.remover, 1);
      salvarPedido(); renderPainelPedido();
    });
  }

  const total = listaPedido.reduce((s, i) => s + i.preco_cents * i.qtd, 0);
  document.getElementById('total-pedido').textContent = formatarPreco(total);
}

function abrirPainelPedido(){ document.getElementById('painel-fundo').classList.add('aberto'); }
function fecharPainelPedido(){ document.getElementById('painel-fundo').classList.remove('aberto'); }

document.getElementById('btn-pedido').onclick = abrirPainelPedido;
document.getElementById('fechar-painel').onclick = fecharPainelPedido;
document.getElementById('painel-fundo').addEventListener('click', (e) => {
  if (e.target.id === 'painel-fundo') fecharPainelPedido();
});

document.getElementById('btn-finalizar').onclick = () => {
  if (listaPedido.length === 0) return;
  let msg = 'Olá! Gostaria de fazer o seguinte pedido:\n\n';
  listaPedido.forEach(item => {
    msg += `• ${item.nome}${item.cor ? ' (' + item.cor + ')' : ''} x${item.qtd} — ${formatarPreco(item.preco_cents * item.qtd)}\n`;
    if (item.arte) msg += `   Arte: ${item.arte}\n`;
    if (item.observacao) msg += `   Obs: ${item.observacao}\n`;
  });
  const total = listaPedido.reduce((s, i) => s + i.preco_cents * i.qtd, 0);
  msg += `\nTotal estimado: ${formatarPreco(total)}`;
  window.open(`https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(msg)}`, '_blank');
  listaPedido = [];
  salvarPedido();
  renderPainelPedido();
  fecharPainelPedido();
};

/* ---- Início ---- */
function esconderPreCarregador(){
  const el = document.getElementById('pre-carregador');
  if (!el) return;
  el.classList.add('saindo');
  setTimeout(() => el.remove(), 550);
}

async function iniciar(){
  const inicio = Date.now();
  try{
    await carregarDados();
    renderTudo();
    renderPainelPedido();
  }catch(err){
    console.error(err);
    document.getElementById('grid-produtos').innerHTML = '<div class="estado-msg">Não foi possível carregar o catálogo agora. Tente novamente em instantes.</div>';
  }finally{
    const tempoRestante = Math.max(0, 500 - (Date.now() - inicio));
    setTimeout(esconderPreCarregador, tempoRestante);
  }
}
iniciar();

/* ---- Fundo com parallax: mouse no desktop, giroscópio no celular ---- */
(function iniciarParallaxFundo(){
  const camadas = [...document.querySelectorAll('.fundo-camada')];
  let alvoX = 0, alvoY = 0, atualX = 0, atualY = 0;

  function aplicarCamadas(){
    atualX += (alvoX - atualX) * 0.06;
    atualY += (alvoY - atualY) * 0.06;
    camadas.forEach(el => {
      const prof = parseFloat(el.dataset.profundidade) || 20;
      el.style.transform = `translate(${(atualX * prof).toFixed(1)}px, ${(atualY * prof).toFixed(1)}px)`;
    });
    requestAnimationFrame(aplicarCamadas);
  }
  aplicarCamadas();

  const temMouse = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  if (temMouse){
    window.addEventListener('mousemove', (e) => {
      alvoX = (e.clientX / window.innerWidth - 0.5) * 2;
      alvoY = (e.clientY / window.innerHeight - 0.5) * 2;
    });
    return;
  }

  if (!window.DeviceOrientationEvent) return;

  function tratarOrientacao(ev){
    const gamma = ev.gamma || 0;
    const beta = ev.beta || 0;
    alvoX = Math.max(-1, Math.min(1, gamma / 25));
    alvoY = Math.max(-1, Math.min(1, (beta - 35) / 25));
  }

  if (typeof DeviceOrientationEvent.requestPermission === 'function'){
    const pedirPermissao = () => {
      DeviceOrientationEvent.requestPermission().then(estado => {
        if (estado === 'granted') window.addEventListener('deviceorientation', tratarOrientacao);
      }).catch(() => {});
      document.body.removeEventListener('touchstart', pedirPermissao);
      document.body.removeEventListener('click', pedirPermissao);
    };
    document.body.addEventListener('touchstart', pedirPermissao, { once: true });
    document.body.addEventListener('click', pedirPermissao, { once: true });
  } else {
    window.addEventListener('deviceorientation', tratarOrientacao);
  }
})();
</script>
